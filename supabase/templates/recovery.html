<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Restablecé tu contraseña de EloShape</title>
  </head>
  <body style="margin:0;background:#0b0c0f;color:#f7f7f8;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0b0c0f;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#17191e;border:1px solid #2b2e34;border-radius:12px">
            <tr>
              <td style="padding:32px">
                <p style="margin:0;color:#f09a35;font-size:22px;font-weight:800">EloShape</p>
                <p style="margin:5px 0 0;color:#a6a9b0;font-size:11px;font-weight:700;letter-spacing:2px">COMPETITIVE CIRCUIT</p>
                <h1 style="margin:32px 0 12px;font-size:26px;line-height:1.25">Restablecé tu contraseña</h1>
                <p style="margin:0;color:#c3c5ca;font-size:15px;line-height:1.65">Recibimos una solicitud para cambiar la contraseña de tu cuenta de EloShape.</p>
                <p style="margin:28px 0">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e07a2a;color:#17110b;text-decoration:none;font-size:14px;font-weight:700;padding:13px 20px;border-radius:7px">Crear una nueva contraseña</a>
                </p>
                <p style="margin:0;color:#858991;font-size:12px;line-height:1.6">Si no solicitaste este cambio, ignorá el mensaje y tu contraseña seguirá siendo la misma.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
