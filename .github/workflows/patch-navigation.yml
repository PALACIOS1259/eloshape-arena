name: Patch result navigation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-navigation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch navigation
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/patch_navigation.py
          python3 /tmp/patch_navigation.py

      - name: Commit navigation
        shell: bash
        run: |
          if git diff --quiet -- src/routes/_authenticated/admin.tsx 'src/routes/tournaments.$slug.tsx'; then
            echo "Nothing to patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/admin.tsx 'src/routes/tournaments.$slug.tsx'
          git commit -m "feat: link match result and dispute workflows"
          git push origin HEAD:main
