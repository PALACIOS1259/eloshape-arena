name: Capture lint debt

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/capture-lint.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          bun run lint > lint-report.txt 2>&1
          exit 0
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-report.txt
          git commit -m "chore: capture lint report"
          git push origin HEAD:main
