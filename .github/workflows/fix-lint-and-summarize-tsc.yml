name: Fix lint and summarize type debt

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-lint-and-summarize-tsc.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fix remaining lint errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/integrations/supabase/previewAuthStorage.ts')
          s = p.read_text()
          old = '''      let done = false;
      let timer: ReturnType<typeof setTimeout>;
      const finish = (r: { ok: boolean; value?: string | null } | null) => {'''
          new = '''      let done = false;
      const finish = (r: { ok: boolean; value?: string | null } | null) => {'''
          if old not in s:
              raise SystemExit('preview timer declaration target not found')
          s = s.replace(old, new, 1)
          old2 = '''      for (const origin of editorOrigins) window.parent.postMessage(msg, origin);
      timer = setTimeout(() => finish(null), TIMEOUT);'''
          new2 = '''      for (const origin of editorOrigins) window.parent.postMessage(msg, origin);
      const timer = setTimeout(() => finish(null), TIMEOUT);'''
          if old2 not in s:
              raise SystemExit('preview timer assignment target not found')
          p.write_text(s)

          p = Path('supabase/functions/riot-sync/index.ts')
          s = p.read_text()
          marker = '''function shapeAccount(row: any, profile: any, fromCache: boolean, noticeOverride?: string | null) {'''
          replacement = '''type RiotAccountRow = {
  riot_id?: string | null;
  game_name?: string | null;
  tag_line?: string | null;
  platform?: string | null;
  solo_tier?: string | null;
  solo_rank?: string | null;
  solo_lp?: number | null;
  wins?: number | null;
  losses?: number | null;
  queue_type?: string | null;
  account_level?: number | null;
  account_level_synced_at?: string | null;
  data_verified?: boolean | null;
  ownership_verified?: boolean | null;
  verification_method?: string | null;
  last_synced_at?: string | null;
};

type ProfileShape = {
  eligibility?: string | null;
  division?: { code?: string | null; name?: string | null } | null;
};

function shapeAccount(
  row: RiotAccountRow,
  profile: ProfileShape | null,
  fromCache: boolean,
  noticeOverride?: string | null,
) {'''
          if marker not in s:
              raise SystemExit('shapeAccount target not found')
          p.write_text(s.replace(marker, replacement, 1))
          PY
          bunx prettier --write src/integrations/supabase/previewAuthStorage.ts supabase/functions/riot-sync/index.ts
          bun run lint

      - name: Summarize current TypeScript errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from collections import defaultdict

          text = Path('ci-tsc-report.txt').read_text() if Path('ci-tsc-report.txt').exists() else ''
          pattern = re.compile(r'^(?P<file>[^\s(]+)\((?P<line>\d+),(?P<col>\d+)\): error (?P<code>TS\d+): (?P<msg>.*)$')
          grouped = defaultdict(list)
          for line in text.splitlines():
              m = pattern.match(line)
              if m:
                  grouped[m.group('file')].append((m.group('line'), m.group('code'), m.group('msg')))
          out = []
          for file in sorted(grouped):
              items = grouped[file]
              out.append(f'## {file} — {len(items)} error(s)')
              for line, code, msg in items[:8]:
                  out.append(f'- L{line} {code}: {msg}')
              if len(items) > 8:
                  out.append(f'- ... {len(items)-8} more')
              out.append('')
          Path('ci-tsc-summary.txt').write_text('\n'.join(out) if out else 'No TypeScript errors captured.\n')
          PY

      - name: Commit fixes and summary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/previewAuthStorage.ts supabase/functions/riot-sync/index.ts ci-tsc-summary.txt
          git commit -m "fix: clear remaining lint errors"
          git push origin HEAD:main
