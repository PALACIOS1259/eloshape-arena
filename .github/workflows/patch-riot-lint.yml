name: Patch Riot lint types

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-riot-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch explicit Riot types
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/riot-sync/index.ts
          git commit -m "fix: type Riot response shaping"
          git push origin HEAD:main
