name: Harden Riot CORS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/harden-riot-cors.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Riot Edge Function CORS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/functions/riot-sync/index.ts")
          text = path.read_text()

          old_cors = '''const CORS = {
            "Access-Control-Allow-Origin": "*",
            "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
            "Access-Control-Allow-Methods": "GET, POST, OPTIONS",
            "Content-Type": "application/json",
          };'''

          new_cors = '''const BASE_CORS: Record<string, string> = {
            "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
            "Access-Control-Allow-Methods": "GET, POST, OPTIONS",
            "Content-Type": "application/json",
          };

          const DEFAULT_ALLOWED_ORIGINS = [
            "http://localhost:8080",
            "http://127.0.0.1:8080",
            "https://eloshape-compete-elevate.lovable.app",
            "https://id-preview--b25a5d43-ea7c-4091-b928-2da59c732426.lovable.app",
          ];

          const ALLOWED_ORIGINS = new Set([
            ...DEFAULT_ALLOWED_ORIGINS,
            ...(Deno.env.get("ELOSHAPE_ALLOWED_ORIGINS") ?? "")
              .split(",")
              .map((origin) => origin.trim())
              .filter(Boolean),
          ]);

          function isAllowedOrigin(origin: string) {
            return ALLOWED_ORIGINS.has(origin);
          }

          function corsHeaders(req: Request) {
            const headers: Record<string, string> = { ...BASE_CORS, Vary: "Origin" };
            const origin = req.headers.get("Origin");
            if (origin && isAllowedOrigin(origin)) {
              headers["Access-Control-Allow-Origin"] = origin;
            }
            return headers;
          }'''

          old_json = '''function json(body: unknown, status = 200) {
            return new Response(JSON.stringify(body), { status, headers: CORS });
          }'''

          new_json = '''function json(req: Request, body: unknown, status = 200) {
            return new Response(JSON.stringify(body), { status, headers: corsHeaders(req) });
          }'''

          old_serve = '''Deno.serve(async (req: Request) => {
            if (req.method === "OPTIONS") return new Response("ok", { headers: CORS });'''

          new_serve = '''Deno.serve(async (req: Request) => {
            const origin = req.headers.get("Origin");
            if (origin && !isAllowedOrigin(origin)) {
              return new Response(
                JSON.stringify({ ok: false, code: "origin_not_allowed", error: "Origin not allowed." }),
                { status: 403, headers: { ...BASE_CORS, Vary: "Origin" } },
              );
            }
            if (req.method === "OPTIONS") {
              return new Response("ok", { headers: corsHeaders(req) });
            }'''

          for old, new, label in [
            (old_cors, new_cors, "CORS block"),
            (old_json, new_json, "json helper"),
            (old_serve, new_serve, "serve preflight"),
          ]:
            if old not in text:
              raise SystemExit(f"Expected {label} was not found; refusing a partial patch.")
            text = text.replace(old, new, 1)

          text = text.replace("return json(", "return json(req, ")
          path.write_text(text)
          PY

      - name: Commit hardened function
        shell: bash
        run: |
          if git diff --quiet -- supabase/functions/riot-sync/index.ts; then
            echo "Riot CORS was already hardened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/riot-sync/index.ts
          git commit -m "fix: restrict Riot Edge Function origins"
          git push origin HEAD:main
