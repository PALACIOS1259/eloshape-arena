name: Fix final TypeScript callbacks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fix strict callback returns and nullable scores
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('src/routes/_authenticated/team.tsx'),
              Path('src/routes/_authenticated/admin_.splits.tsx'),
              Path('src/routes/_authenticated/matches.$matchId.tsx'),
          ]

          pattern = re.compile(r'(?P<indent>\s*)if \(!result\.ok\) return toast\.error\((?P<expr>[^;]+)\);')

          for path in files:
              text = path.read_text()
              def repl(match):
                  indent = match.group('indent')
                  expr = match.group('expr')
                  return f'{indent}if (!result.ok) {{\n{indent}  toast.error({expr});\n{indent}  return;\n{indent}}}'
              text = pattern.sub(repl, text)
              text = text.replace(
                  'score={official ? state.match.scoreA : claim?.scoreA}',
                  'score={official ? state.match.scoreA : (claim?.scoreA ?? null)}',
              )
              text = text.replace(
                  'score={official ? state.match.scoreB : claim?.scoreB}',
                  'score={official ? state.match.scoreB : (claim?.scoreB ?? null)}',
              )
              path.write_text(text)
          PY

          bunx prettier --write \
            src/routes/_authenticated/team.tsx \
            src/routes/_authenticated/admin_.splits.tsx \
            'src/routes/_authenticated/matches.$matchId.tsx'

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/team.tsx src/routes/_authenticated/admin_.splits.tsx 'src/routes/_authenticated/matches.$matchId.tsx'
          git commit -m "fix: satisfy final strict TypeScript checks"
          git push origin main
