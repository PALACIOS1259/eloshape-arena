name: EloShape CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discord-container:
    name: Discord bot container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build permanent bot image without credentials
        run: docker build -f discord/Dockerfile -t eloshape-discord:ci .
      - name: Check Discord runtime
        run: >-
          docker run --rm --entrypoint node eloshape-discord:ci
          -e "const d=require('discord.js'); if(d.Events.ClientReady !== 'clientReady') process.exit(1); console.log(d.version)"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build application and generate routes
        env:
          SUPABASE_URL: https://ujlzcdmotrihwgjshdcs.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_WRqpmHg33JlYlJjzc8nlWw_6C8P7-vi
          VITE_SUPABASE_URL: https://ujlzcdmotrihwgjshdcs.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WRqpmHg33JlYlJjzc8nlWw_6C8P7-vi
        run: bun run build

      - name: Verify generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  database:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start local Supabase database
        run: supabase db start

      - name: Run security boundary tests
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/security_boundaries.test.sql

      - name: Run competition engine integration tests
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/competition_engine.test.sql

      - name: Run closed beta security tests
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/closed_beta.test.sql

      - name: Run verified Discord identity tests
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/discord_link.test.sql

      - name: Run verified beta Discord role tests
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/beta_discord.test.sql

      - name: Run beta email admin authorization tests
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/beta_email_admin.test.sql

      - name: Run 16-team Semi-Split stress test
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/prelaunch_16_team_semisplit.test.sql

      - name: Run scrim and qualifier priority tests
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/scrims_and_priority.test.sql

      - name: Stop local Supabase database
        if: always()
        run: supabase stop --no-backup
