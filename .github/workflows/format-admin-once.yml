name: Format admin redesign once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/format-admin-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format redesigned admin files
        run: bunx prettier --write src/components/eloshape/CompetitionOpsPanel.tsx src/routes/_authenticated/admin.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/eloshape/CompetitionOpsPanel.tsx src/routes/_authenticated/admin.tsx
          git commit -m "Format admin redesign"
          git push origin HEAD:staging
