<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">EloShape — Competitive League of Legends circuit</title>
  <desc id="desc">EloShape branding on a dark background with the tagline No necesitás ser Challenger para competir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0f"/>
      <stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f1f3"/>
      <stop offset="1" stop-color="#8e929a"/>
    </linearGradient>
    <linearGradient id="brand" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc140"/>
      <stop offset="1" stop-color="#e07a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="62%">
      <stop offset="0" stop-color="#e07a2a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e07a2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M0 500 L1200 270 L1200 630 L0 630 Z" fill="#ffffff" opacity="0.018"/>
  <path d="M0 545 L1200 315" stroke="#ffffff" stroke-opacity="0.07"/>

  <g transform="translate(100 133) scale(3.65)">
    <g fill="url(#silver)">
      <path d="M31 3 L9 19 L9 57 L31 73 L31 63 L18 53 L18 23 L31 13 Z"/>
      <path d="M22 27 L31 20 L31 29 L26 33 L31 33 L31 41 L22 41 Z"/>
      <path d="M22 46 L31 46 L31 54 L31 57 L22 51 Z"/>
    </g>
    <g fill="url(#brand)">
