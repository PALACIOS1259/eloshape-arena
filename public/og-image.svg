      <path d="M33 20 L42 27 L42 33 L36 33 L42 37 L42 47 L33 54 L33 46 L36 43 L33 41 L33 33 Z"/>
    </g>
  </g>

  <text x="390" y="247" fill="#f7f7f8" font-family="Inter, Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-4">Elo<tspan fill="#f09a35">Shape</tspan></text>
  <text x="394" y="302" fill="#a6a9b0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">COMPETITIVE CIRCUIT</text>

  <text x="100" y="485" fill="#f7f7f8" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">No necesitás ser Challenger para competir.</text>
  <text x="100" y="535" fill="#a6a9b0" font-family="Inter, Arial, sans-serif" font-size="24">Divisions · Tournaments · Teams · Rankings</text>

  <rect x="100" y="577" width="210" height="4" rx="2" fill="url(#brand)"/>
